# Builds the docs website from docs/ with MkDocs and publishes it to GitHub Pages
# whenever the docs change on main. Needs Settings > Pages > Source set to
# "GitHub Actions" in the repo, once.
name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:  # run it by hand from the Actions tab

permissions:
  contents: read
  pages: write     # to publish to Pages
  id-token: write  # to prove the deploy comes from this workflow

concurrency:  # one deploy at a time; a newer push replaces a waiting one
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install "mkdocs<2" mkdocs-material  # MkDocs 2 drops the plugins and themes Material needs
      - run: mkdocs build --strict  # a broken link fails the build instead of publishing it
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
