[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdgui"
version = "0.3.1"
description = "Simple terminal GUIs: draw your layout as text, the view runs itself"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["terminal", "tui", "gui", "cli", "widgets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
license = "MIT"
authors = [{name = "olliez-mods"}]

[project.urls]
homepage = "https://github.com/olliez-mods/cmdgui"
